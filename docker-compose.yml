services:
  # 1. MongoDB 7.0 (Vector DB, Resume Knowledge Base & Persisted Conversation Threads)
  mongodb:
    image: mongo:7.0
    container_name: resume-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./database/mongodb_init.js:/docker-entrypoint-initdb.d/01_init.js:ro
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Local Email Inbox (Inbucket) - Catch and view all Magic Link OTP emails
  inbucket:
    image: inbucket/inbucket:3.1.0
    container_name: resume-inbucket
    restart: unless-stopped
    ports:
      - "9000:9000" # Inbucket Web UI (http://localhost:9000)
      - "2500:2500" # Inbound SMTP port

  # 3. Local Grafana LGTM OpenTelemetry Stack (Grafana + Tempo + Loki + Prometheus)
  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: resume-grafana-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana Dashboard (http://localhost:3000 - user: admin / pass: admin)
      - "4317:4317" # OTLP gRPC Ingestion
      - "4318:4318" # OTLP HTTP Ingestion
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

volumes:
  mongodata:
