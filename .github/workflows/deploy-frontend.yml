name: Deploy Digital Twin Frontend to GitHub Pages

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'src/resume-assistant-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/resume-assistant-frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/resume-assistant-frontend
        run: npm ci

      - name: Build frontend for GitHub Pages
        working-directory: src/resume-assistant-frontend
        env:
          GITHUB_PAGES: "true"
          VITE_BASE_PATH: "/digital-twin/"
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_aHVtYmxlLWZpbmNoLTYzMDIuY2xlcmsuYWNjb3VudHMuZGV2JA' }}
          VITE_BACKEND_API_URL: ${{ secrets.VITE_BACKEND_API_URL || 'https://digitaltwinbe.runasp.net' }}
          VITE_API_URL: ${{ secrets.VITE_BACKEND_API_URL || 'https://digitaltwinbe.runasp.net' }}
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/resume-assistant-frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
